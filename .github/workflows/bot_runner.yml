name: CiroAnime Bot On-Demand Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_bot]

concurrency:
  group: ciroanime_runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install & Setup Official Cloudflare WARP SOCKS5 Tunnel
        run: |
          echo "📥 Memasang Cloudflare WARP client resmi..."
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.11.309.0_amd64.deb || curl -fsSL -o /tmp/warp.deb https://pkg.cloudflareclient.com/pool/jammy/main/c/cloudflare-warp/cloudflare-warp_2024.6.497.0_amd64.deb || true

          if [ -f /tmp/warp.deb ] && [ $(stat -c%s /tmp/warp.deb) -gt 1000000 ]; then
            sudo dpkg -i /tmp/warp.deb || true
          else
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -y
            sudo apt-get install -y cloudflare-warp
          fi

          sudo systemctl start warp-svc
          sleep 2

          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true

          sleep 3
          echo "✅ Status WARP:"
          warp-cli --accept-tos status || true

      - name: Ensure Executable Permissions
        run: |
          chmod +x ./bin/challenge || true

      - name: Run CiroAnime Bot Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://ciro-anime-wake.captenciro.workers.dev' }}
          PROXY_URL: socks5://127.0.0.1:40000
          WAKE_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          WAKE_QUERY: ${{ github.event.client_payload.query }}
          WAKE_MSG_ID: ${{ github.event.client_payload.wake_msg_id }}
        run: |
          python -u main.py
